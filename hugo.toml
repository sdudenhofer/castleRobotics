baseURL = "https://cr.datadudeconsulting.com/"
locale = "en-US"
title = "Castle Robotics Club"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "FRC Team 6498 from Castle High School in Newburgh, Indiana. An award-winning FIRST Robotics Competition team."
  teamNumber = "6498"
  tagline = "To create and promote a lasting impact of science and technology for our community with a long-term goal of building a firm foundation for the next generation of STEAM."
  address = "3344 IN-261, Newburgh, IN 47630"
  mapURL = "https://maps.google.com/?q=3344%20IN-261,%20Newburgh,%20IN%2047630"
  email = "castlerobotics6498@gmail.com"
  phone = "(812) 853-3331"
  founded = 2016
  logo = "images/brand/logo.png"

  [[params.social]]
    name = "Facebook"
    url = "https://www.facebook.com/FRC6498/"
  [[params.social]]
    name = "Instagram"
    url = "https://www.instagram.com/frc6498/"
  [[params.social]]
    name = "X"
    url = "https://twitter.com/castle6498"
  [[params.social]]
    name = "YouTube"
    url = "https://www.youtube.com/channel/UCQG7O_Vl9-W6z3ri7BBoRLg"

